<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadow Designer Loading</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, Segoe UI, Roboto, sans-serif;
      }

      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 16% 12%, rgba(56, 189, 248, 0.26), transparent 34%),
          radial-gradient(circle at 90% 8%, rgba(168, 85, 247, 0.22), transparent 38%),
          linear-gradient(142deg, #061224, #11294a 50%, #341753);
        color: #dbeafe;
      }

      .shell {
        width: min(520px, calc(100vw - 48px));
        border: 1px solid rgba(148, 191, 255, 0.35);
        border-radius: 18px;
        background: rgba(7, 17, 34, 0.74);
        backdrop-filter: blur(10px);
        padding: 24px 26px;
        box-shadow: 0 24px 48px rgba(3, 8, 20, 0.45);
      }

      .logo {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        border: 1px solid rgba(148, 191, 255, 0.42);
        background:
          linear-gradient(165deg, rgba(56, 189, 248, 0.35), rgba(168, 85, 247, 0.45)),
          rgba(15, 25, 44, 0.85);
        display: grid;
        place-items: center;
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      h1 {
        margin: 12px 0 4px;
        font-size: 1.1rem;
      }

      p {
        margin: 0;
        color: #9cc7fb;
        font-size: 0.84rem;
      }

      .bar {
        margin-top: 16px;
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: rgba(14, 29, 53, 0.7);
        overflow: hidden;
      }

      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2dd4bf, #38bdf8, #a78bfa);
        animation: sweep 1.1s ease-in-out infinite;
      }

      @keyframes sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="logo">SD</div>
      <h1>Shadow Designer</h1>
      <p>Preparing workspace, assets, and export pipeline...</p>
      <div class="bar"></div>
    </main>
  </body>
</html>
