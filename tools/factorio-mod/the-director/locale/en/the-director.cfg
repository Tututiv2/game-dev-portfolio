[mod-setting-description]
dir-enabled=The swarm grows resistant to whatever damage type you use most, and forgets it when you stop. Safe to toggle mid-game.
dir-adapt-cap=Hardest the swarm can ever get against a single damage type. 0.6 means a maximum of 60% of that damage is shrugged off. Nothing ever becomes immune.
dir-adapt-threshold=Share of your damage a type must exceed before the swarm reacts to it at all. At 0.15, spreading your damage across seven or more types means they never adapt to any of it.
dir-adapt-rate=How far the swarm moves toward its target resistance each update (once per second). Higher reacts faster and feels harsher.
dir-adapt-memory=How much of what you did is remembered each update. 0.985 is roughly a one-minute memory; lower forgets faster and rewards switching weapons.
dir-adapt-evolution-gate=Scale all resistance by evolution factor, so an early game is untouched and a late game is fully adaptive. Turn off for full pressure from minute one.
dir-industry-bias=How much the composition of your factory nudges the swarm on its own, before you have fired a shot. 0 disables it: only what kills them matters.
dir-adapt-gui=Show the resistance readout panel. Toggle in game with CONTROL + SHIFT + B.
dir-director=Something studies your factory, finds where you are soft, and waits for your weakest moment. It spawns reinforcements and strengthens them as its threat grows, and it never stops growing.
dir-assess-period=How often it looks at your base and decides whether to move. Lower is relentless.
dir-threat-scale=Multiplies how fast it grows and how much it fields. It does NOT make it choose worse targets - you cannot dial away the intelligence.
dir-notifications=Print what it is doing, at whatever detail your researched intel allows.

[controls]
dir-toggle-gui=Toggle resistance panel

[technology-name]
dir-intel-1=Signal Triangulation
dir-intel-2=Pattern Analysis
dir-intel-3=Deep Listening

[technology-description]
dir-intel-1=Something has been choosing where to hit you. You cannot hear it yet, but you can tell when it has moved.
dir-intel-2=Enough of the pattern to know which way it is looking before it arrives.
dir-intel-3=You can finally read what it has learned about you - including which of your weapons it has stopped being afraid of.

