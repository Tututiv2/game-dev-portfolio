tfm-qol-belts=Faster belts
tfm-qol-belt-speed=Belt speed multiplier
tfm-qol-solar=Better solar and accumulators
tfm-qol-solar-mult=Solar panel output multiplier
tfm-qol-accumulator-mult=Accumulator capacity multiplier
tfm-qol-stacks=Bigger item stacks
tfm-qol-stack-mult=Stack size multiplier
tfm-qol-pavement=Faster pavement
tfm-qol-reach=Longer reach
tfm-qol-reach-bonus=Reach distance bonus
tfm-qol-oil=Oil wells never dry up
tfm-qol-oil-yield=Minimum oil well yield

[mod-setting-description]
tfm-qol-override=Off by default on purpose. Each tweak below stands down automatically while the mod it replaces is still enabled, so nothing is ever applied twice. Turn this on only if you want both.
tfm-qol-belts=Multiplies the speed of every belt, underground and splitter, including modded ones. Stands down while more-belts is enabled.
tfm-qol-belt-speed=2.0 is double vanilla speed.
tfm-qol-solar=Multiplies solar panel output and accumulator capacity. Stands down while Advanced-Electric-Revamped is enabled.
tfm-qol-solar-mult=Applies to every solar panel, including modded ones.
tfm-qol-accumulator-mult=Charge and discharge rates scale with capacity, or a bigger battery would still trickle.
tfm-qol-stacks=Multiplies the stack size of every stackable item. Items that are deliberately unique (armour, blueprints) are left alone. Stands down while BigBags is enabled.
tfm-qol-stack-mult=10 matches BigBags' default.
tfm-qol-pavement=Walk faster on stone paths and concrete, at the same speeds FasterPavements uses. Stands down while it is enabled.
tfm-qol-reach=Build and mine from much further away. Applies instantly, no restart. Stands down while far-reach is enabled.
tfm-qol-reach-bonus=150 matches far-reach's default.
tfm-qol-oil=Tops crude oil wells back up so they never fall below the minimum yield. Applies instantly, no restart. Stands down while InfiniteOil is enabled.
tfm-qol-oil-yield=100 matches InfiniteOil's default.

