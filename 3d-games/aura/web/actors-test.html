<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURA Actors</title>
<style>
  :root { --bg: #07080d; --panel: rgba(12, 14, 22, 0.88); --ink: #d8e6f2; --dim: #7f8ea3; --cyan: #4fdcff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; left: 8px; top: 8px; width: 290px; max-height: calc(100% - 16px); overflow: auto; background: var(--panel);
        border: 1px solid #1d2433; border-radius: 8px; padding: 10px; box-sizing: border-box; }
  h1 { font-size: 13px; margin: 0 0 8px; color: var(--cyan); letter-spacing: 0.08em; }
  .row { display: flex; gap: 6px; align-items: center; margin: 5px 0; flex-wrap: wrap; }
  label { color: var(--dim); min-width: 52px; }
  button, select { background: #151b28; color: var(--ink); border: 1px solid #2a3448; border-radius: 4px; padding: 3px 7px; font: inherit; cursor: pointer; }
  button.on { border-color: var(--cyan); color: var(--cyan); }
  input[type=range] { flex: 1; }
  #acts button { margin: 1px; }
  #vm { position: fixed; right: 8px; bottom: 8px; width: 360px; height: 220px; border: 1px solid #2a3448; border-radius: 6px; pointer-events: none; }
  #vmlabel { position: fixed; right: 14px; bottom: 232px; color: var(--dim); }
</style>
</head>
<body>
<div id="ui">
  <h1>AURA / ACTORS</h1>
  <div class="row"><label>actor</label><select id="who"></select></div>
  <div class="row" id="acts"></div>
  <div class="row"><label>dir</label><button data-dir="left">left</button><button data-dir="right">right</button><button data-dir="over">over</button></div>
  <div class="row"><label>t</label><input id="t" type="range" min="0" max="1" step="0.01" value="0"><span id="tv">0</span></div>
  <div class="row"><label>loop</label><input id="loop" type="checkbox" checked><label>secs</label><input id="dur" type="number" value="1.2" step="0.1" style="width:52px"></div>
  <div class="row"><label>move</label><input id="move" type="range" min="0" max="1" step="0.01" value="0"></div>
  <div class="row"><label>air</label><input id="air" type="checkbox"><label>holding</label><input id="holding" type="checkbox"></div>
  <div class="row"><label>squeeze</label><input id="squeeze" type="range" min="0" max="1" step="0.01" value="1"></div>
  <div class="row"><label>aura</label><input id="aura" type="range" min="0" max="1" step="0.01" value="0"></div>
  <div class="row"><button id="sever">sever ogre arm</button><button id="flash">flash</button><button id="cycle">cycle all</button></div>
  <div class="row"><label>view</label><button data-snap="all">all</button><button data-snap="player">player</button><button data-snap="sister">sister</button>
    <button data-snap="goblin">goblin</button><button data-snap="goblin2">goblin2</button><button data-snap="ogre">ogre</button><button data-snap="forearm">forearm</button><button data-snap="hand">ogre hand</button><button data-snap="viewmodel">viewmodel</button></div>
  <div class="row" style="color:var(--dim)">drag = orbit · right-drag = pan · wheel = zoom</div>
</div>
<canvas id="c"></canvas>
<div id="vmlabel">first person (fov 75)</div>
<script type="module">
import * as THREE from './vendor/three/three.module.js';
import { makePlayer, makeSister, makeGoblin, makeOgre, makeViewmodel } from './actors.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.autoClear = false;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1830);
scene.fog = new THREE.Fog(0x1a1830, 30, 80);
scene.add(new THREE.HemisphereLight(0x8f9cd8, 0x2a2233, 1.3));
const sun = new THREE.DirectionalLight(0xffd6b0, 2.4);
sun.position.set(6, 12, 9); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.normalBias = 0.02; sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 });
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x3a3a44, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(20, 20, 0x555a70, 0x2c3040); grid.position.y = 0.002; scene.add(grid);

const actors = {
  player: makePlayer(), sister: makeSister(), goblin: makeGoblin(1), goblin2: makeGoblin(4), ogre: makeOgre(),
};
// make sure there is one club and one spear on stage
for (let s = 1; s < 40 && actors.goblin.weaponType === actors.goblin2.weaponType; s++) { actors.goblin2.dispose(); actors.goblin2 = makeGoblin(4 + s); }
const X = { goblin: -4.2, goblin2: -2.6, player: -0.8, sister: 0.8, ogre: 4.4 };
for (const k in actors) { actors[k].root.position.x = X[k]; scene.add(actors[k].root); }
const state = {}; for (const k in actors) state[k] = { action: 'idle', t: 0, dir: 'over', move: 0, air: false, squeeze: 1, holding: false, combo: 0 };

// viewmodel inset
const vmCam = new THREE.PerspectiveCamera(75, 360 / 220, 0.05, 100);
const vmScene = new THREE.Scene(); vmScene.background = new THREE.Color(0x0b0d16);
vmScene.add(new THREE.HemisphereLight(0x8f9cd8, 0x2a2233, 1.3));
const vmSun = new THREE.DirectionalLight(0xffd6b0, 2.2); vmSun.position.set(2, 4, 3); vmScene.add(vmSun);
vmScene.add(vmCam);
const vm = makeViewmodel(); vmCam.add(vm.group);
state.viewmodel = { action: 'idle', t: 0, dir: 'right', move: 0, air: false };
let vmFull = false;

// camera + orbit
const cam = new THREE.PerspectiveCamera(45, 1, 0.05, 200);
const orbit = { target: new THREE.Vector3(0, 1.2, 0), yaw: 0, pitch: 0.12, dist: 13 };
function placeCam() {
  const cp = Math.cos(orbit.pitch);
  cam.position.set(orbit.target.x + Math.sin(orbit.yaw) * cp * orbit.dist, orbit.target.y + Math.sin(orbit.pitch) * orbit.dist, orbit.target.z + Math.cos(orbit.yaw) * cp * orbit.dist);
  cam.lookAt(orbit.target);
}
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, b: e.button }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (drag.b === 2) {
    const r = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0), u = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
    orbit.target.addScaledVector(r, -dx * orbit.dist * 0.0015).addScaledVector(u, dy * orbit.dist * 0.0015);
  } else { orbit.yaw -= dx * 0.008; orbit.pitch = Math.max(-0.4, Math.min(1.4, orbit.pitch + dy * 0.006)); }
});
canvas.addEventListener('wheel', (e) => { orbit.dist = Math.max(0.2, Math.min(60, orbit.dist * Math.exp(e.deltaY * 0.001))); e.preventDefault(); }, { passive: false });

// UI
const $ = (id) => document.getElementById(id);
let who = 'player';
function refreshUI() {
  const a = who === 'viewmodel' ? vm : actors[who];
  const box = $('acts'); box.innerHTML = '';
  for (const n of a.actions) {
    const b = document.createElement('button'); b.textContent = n; if (state[who].action === n) b.className = 'on';
    b.onclick = () => { state[who].action = n; state[who].t = 0; refreshUI(); };
    box.appendChild(b);
  }
  for (const b of document.querySelectorAll('[data-dir]')) b.className = state[who].dir === b.dataset.dir ? 'on' : '';
  $('move').value = state[who].move; $('air').checked = state[who].air;
}
for (const k of [...Object.keys(actors), 'viewmodel']) { const o = document.createElement('option'); o.textContent = k; $('who').appendChild(o); }
$('who').onchange = (e) => { who = e.target.value; refreshUI(); };
for (const b of document.querySelectorAll('[data-dir]')) b.onclick = () => { state[who].dir = b.dataset.dir; refreshUI(); };
$('t').oninput = (e) => { $('loop').checked = false; state[who].t = +e.target.value; };
$('move').oninput = (e) => { state[who].move = +e.target.value; };
$('air').onchange = (e) => { state[who].air = e.target.checked; };
$('holding').onchange = (e) => { state.ogre.holding = e.target.checked; };
$('squeeze').oninput = (e) => { state.ogre.squeeze = +e.target.value; };
$('aura').oninput = (e) => { actors.player.setAura(+e.target.value); vm.setAura(+e.target.value); };
let severed = null;
$('sever').onclick = () => { if (!severed) { severed = actors.ogre.sever(); if (severed) scene.attach(severed); } };
$('flash').onclick = () => (who === 'viewmodel' ? vm : actors[who]).flash(0xffffff, 0.25);
let cycling = null;
$('cycle').onclick = () => {
  const a = who === 'viewmodel' ? vm : actors[who], list = [];
  for (const n of a.actions) { const d = (a.dirs || {})[n]; if (d) for (const x of d) list.push([n, x]); else list.push([n, state[who].dir]); }
  cycling = { list, i: 0, k: who };
  $('loop').checked = true;
};
for (const b of document.querySelectorAll('[data-snap]')) b.onclick = () => window.snap(b.dataset.snap);

// sister hangs from the ogre's fist when both are in their hold states
function hangSister() {
  const s = state.sister, o = actors.ogre;
  if (s.action !== 'held' || severed) return false;
  const p = new THREE.Vector3(); o.sockets.grabHand.getWorldPosition(p);
  const sr = actors.sister.root; sr.position.set(p.x, p.y - actors.sister.neckY, p.z); sr.rotation.y = o.root.rotation.y;
  return true;
}

let paused = false, last = performance.now();
function step(dt) {
  for (const k in state) {
    const st = state[k];
    if ($('loop').checked && (!cycling || cycling.k === k)) {
      st.t += dt / Math.max(0.1, +$('dur').value);
      if (st.t >= 1) {
        st.t = cycling && cycling.k === k ? 0 : st.t - 1;
        if (cycling && cycling.k === k) { cycling.i++; if (cycling.i >= cycling.list.length) cycling = null; else { st.action = cycling.list[cycling.i][0]; st.dir = cycling.list[cycling.i][1]; refreshUI(); } }
      }
    }
    if (k === who) { $('t').value = st.t; $('tv').textContent = st.t.toFixed(2); }
  }
  if (cycling && cycling.i === 0 && state[cycling.k].action !== cycling.list[0][0]) { const c = cycling.list[0]; state[cycling.k].action = c[0]; state[cycling.k].dir = c[1]; refreshUI(); }
  for (const k in actors) actors[k].pose(dt, state[k]);
  vm.pose(dt, state.viewmodel);
  if (!hangSister()) actors.sister.root.position.set(X.sister, 0, 0);
}
function render() {
  const w = innerWidth, h = innerHeight;
  if (canvas.width !== Math.floor(w * renderer.getPixelRatio())) { renderer.setSize(w, h); }
  cam.aspect = w / h; cam.updateProjectionMatrix(); placeCam();
  renderer.setViewport(0, 0, w, h); renderer.setScissorTest(false); renderer.clear();
  if (vmFull) { vmCam.aspect = w / h; vmCam.updateProjectionMatrix(); renderer.render(vmScene, vmCam); return; }
  renderer.render(scene, cam);
  const vw = 360, vh = 220;
  renderer.setScissorTest(true); renderer.setScissor(w - vw - 8, 8, vw, vh); renderer.setViewport(w - vw - 8, 8, vw, vh);
  vmCam.aspect = vw / vh; vmCam.updateProjectionMatrix(); renderer.clearDepth(); renderer.render(vmScene, vmCam);
  renderer.setScissorTest(false);
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) step(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- debug hooks for screenshots
const box3 = new THREE.Box3(), c3 = new THREE.Vector3(), s3 = new THREE.Vector3();
window.snap = (name = 'all', view = 'front') => {
  vmFull = name === 'viewmodel'; $('vm').style.display = $('vmlabel').style.display = vmFull ? 'none' : '';
  const yawOf = { front: 0, side: Math.PI / 2, back: Math.PI, left: -Math.PI / 2, three: 0.6 };
  orbit.yaw = yawOf[view] ?? (typeof view === 'number' ? view : 0);
  if (name === 'forearm' || name === 'hand') {
    const sock = name === 'forearm' ? actors.player.sockets.forearmR : actors.ogre.sockets.grabHand;
    sock.getWorldPosition(orbit.target); orbit.dist = name === 'forearm' ? 0.35 : 1.3; orbit.pitch = 0.2; render(); return;
  }
  if (name === 'viewmodel') { render(); return; }
  if (name === 'all') box3.makeEmpty(), Object.values(actors).forEach((a) => box3.expandByObject(a.root));
  else box3.setFromObject(actors[name].root);
  box3.getCenter(c3); box3.getSize(s3);
  orbit.target.copy(c3); orbit.pitch = 0.1;
  orbit.dist = Math.max(s3.y, s3.x * 0.7) * 1.35 + 1.0;
  render();
};
window.setPose = (name, s) => { $('loop').checked = false; Object.assign(state[name], s); refreshUI(); };
window.step = (sec = 0.5, n = 20) => { for (let i = 0; i < n; i++) step(sec / n); render(); };
window.pauseAll = (p = true) => { paused = p; };
window.actors = actors; window.vm = vm; window.orbit = orbit; window.THREE = THREE;
window.getSevered = () => severed;
refreshUI(); placeCam(); window.snap('all');
</script>
<canvas id="vm"></canvas>
</body>
</html>
