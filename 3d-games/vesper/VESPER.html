<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VESPER — orbit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23090b12'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23ffb066' stroke-width='2'/%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#03040a;color:#e8eef7;
    font:400 13px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    user-select:none;cursor:grab}
  body:active{cursor:grabbing}
  canvas{display:block;position:fixed;inset:0}
  #info{position:fixed;left:18px;top:16px;z-index:5;pointer-events:none;
    letter-spacing:.04em;text-shadow:0 2px 14px #000;line-height:1.7}
  #info b{font-weight:500}
  #info .k{color:#ffb066;letter-spacing:.18em;text-transform:uppercase;font-size:11px}
  #info .d{color:#8a97ab;font-size:12px}
  #keys{position:fixed;left:18px;bottom:14px;z-index:5;pointer-events:none;
    color:#5d6a7e;font-size:11px;letter-spacing:.1em}
  #keys b{color:#8fa8c4;font-weight:400}

  #perf{position:fixed;right:18px;top:16px;z-index:5;pointer-events:none;
    text-align:right;font-family:ui-monospace,Consolas,monospace;font-size:11px;
    line-height:1.8;color:#5d6a7e;letter-spacing:.06em;text-shadow:0 2px 10px #000}
  #perf .fps{font-size:17px;color:#8fd9ff}
  #perf .bad{color:#ff9aa6}
  #perf .good{color:#7fdca0}

  /* boot / error curtain */
  #boot{position:fixed;inset:0;z-index:50;background:#03040a;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:6vh 6vw;text-align:center;transition:opacity .6s}
  #boot.gone{opacity:0;pointer-events:none}
  #bootTitle{font-size:clamp(40px,9vw,92px);font-weight:200;letter-spacing:.36em;
    text-indent:.36em;color:#ffb066;
    filter:drop-shadow(0 0 40px rgba(255,150,80,.28))}
  #bootMsg{color:#8a97ab;letter-spacing:.26em;text-transform:uppercase;font-size:12px}
  #bootHint{max-width:620px;line-height:1.9;font-size:12.5px;
    color:#7d8b9c;letter-spacing:.04em}
  #bootHint b{color:#ffb066;font-weight:500}
  #bootHint code{font-family:ui-monospace,Consolas,monospace;color:#8fd9ff;
    background:rgba(120,180,255,.09);padding:2px 7px}
  #boot.err #bootTitle{color:#ff7a8a;filter:drop-shadow(0 0 40px rgba(255,90,110,.3))}
  #boot.err #bootMsg{color:#ff9aa6}
  /* THE STALL BAR.
     Compiling this shader blocks the main thread for tens of seconds on a
     machine that has not seen it before. No timer can tick during that and no
     JavaScript can repaint, so anything driven from script freezes solid and
     the page looks crashed — which is exactly the report this project already
     got once ("stays white").
     A CSS animation of transform/opacity runs on the COMPOSITOR, not the main
     thread, so it keeps moving right through the stall. That is the whole
     reason this is a stylesheet and not a progress callback. */
  #bootBar{width:min(420px,70vw);height:2px;background:rgba(255,176,102,.14);
    overflow:hidden;position:relative}
  #bootBar::after{content:"";position:absolute;inset:0;width:38%;
    background:linear-gradient(90deg,transparent,#ffb066,transparent);
    animation:sweep 1.35s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(370%)}}
  #boot.err #bootBar{display:none}
  #bootNote{color:#5d6a7e;font-size:11.5px;letter-spacing:.08em;max-width:560px;
    line-height:1.8}
  #bootNote b{color:#8fa8c4;font-weight:500}

  /* Shown while a new world is baked (~2 s, and the main thread is blocked for
     all of it). Same reasoning as #bootBar: the pulse is a CSS animation so it
     keeps going during the stall instead of freezing mid-way and reading as a
     hang. Without this, pressing n/p/] just locks the page for two seconds. */
  #busy{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:20;
    padding:7px 18px;border:1px solid rgba(255,176,102,.28);
    background:rgba(3,4,10,.78);color:#ffb066;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity .12s}
  #busy.on{opacity:1;animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  #bootHint pre{text-align:left;white-space:pre-wrap;word-break:break-word;
    background:rgba(255,120,140,.07);border:1px solid rgba(255,120,140,.22);
    padding:12px 14px;margin-top:12px;font-size:11.5px;color:#ffc2cb;max-height:38vh;
    overflow:auto}
</style>
  
</head>
<body>
<canvas id="cv"></canvas>
<div id="info"></div>
<div id="keys"><b>drag</b> orbit · <b>wheel</b> zoom · <b>arrows</b> move the star ·
  <b>n/p</b> archetype · <b>]</b> new seed · <b>space</b> spin</div>
<!-- Always-visible so "is it running properly?" is never a guess again. -->
<div id="perf"></div>
<div id="busy">surveying the surface</div>

<!-- Painted BEFORE any WebGL work starts. Building the scene and compiling the
     shaders blocks the main thread, and a browser that has not painted yet
     shows WHITE — indistinguishable from a crash. This guarantees the first
     thing on screen is a dark page that says what is happening. -->
<div id="boot">
  <div id="bootTitle">VESPER</div>
  <div id="bootMsg">building a world…</div>
  <div id="bootBar"></div>
  <div id="bootNote"></div>
  <div id="bootHint"></div>
</div>

  // of the forty-nine gradients land off the end of the table. That is exactly
  // the kind of difference that makes the ground you stand on disagree with the
  // ground you see.

  // unit of slack on either side and the result is identical everywhere.

  vec4 x_ = floor((j + 0.5) * 0.142857142857);

  vec4 y = y_ * ns.x + ns.yyyy;

  vec3 p1 = vec3(a0.zw, h.y);

/* CELL HASH — built from permute() so it is BIT-EXACT in 32-bit and 64-bit.

   what this was. It is fast and well distributed and it is NOT PORTABLE: it
   works by squeezing entropy out of the low mantissa bits of a fract(), and
   there are 24 of those on the GPU versus 53 in the JavaScript mirror. The two
   therefore disagree BY CONSTRUCTION, which moved every crack boundary slightly
   and left the terrain you stand on out of step with the terrain you see.

   here stays under 2^24, where both float sizes are exact. Two independently
   salted chains give 289^2 = 83,521 distinct cell signatures — with 27 cells in

   is invisible in jitter.

in vec3 vCol;

in float vShade;
in vec3 vUp;
in float vEmis;
in float vY;
in float vMat;
in float vAo;
