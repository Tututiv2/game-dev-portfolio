<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SINGULARITY CHAMBER [v2.5]</title>
    <style>
        :root {
            --term-green: #0f0;
            --term-dim: #004400;
            --term-purple: #bd00ff;
            --term-gold: #ffd700;
            --term-red: #ff3333;
        }
        
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            color: white;
        }

        canvas {
            display: block;
            z-index: 1;
        }

        /* --- UI LAYER --- */
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .hud-panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border: 1px solid #333;
            backdrop-filter: blur(2px);
        }

        /* TOP LEFT: Stats */
        #stats-panel {
            top: 20px;
            left: 20px;
            border-left: 4px solid var(--term-green);
        }

        .stat-row { font-size: 16px; margin-bottom: 4px; text-shadow: 0 0 5px rgba(0,255,0,0.5); }
        .label { color: #888; }
        .val-money { color: var(--term-green); font-weight: bold; }
        .val-dm { color: var(--term-purple); font-weight: bold; }
        .val-hps { color: #0ff; }

        /* RIGHT: Shop */
        #shop-panel {
            top: 20px;
            right: 20px;
            width: 260px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-right: 4px solid var(--term-green);
            max-height: 90vh;
            overflow-y: auto;
        }

        .shop-header {
            font-size: 14px;
            color: #666;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            margin-bottom: 5px;
        }

        .btn {
            background: linear-gradient(90deg, #001100, #002200);
            border: 1px solid var(--term-dim);
            color: var(--term-green);
            padding: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            text-align: left;
            transition: all 0.1s;
            position: relative;
            overflow: hidden;
        }

        .btn:hover:not(.disabled) {
            background: #003300;
            border-color: var(--term-green);
            box-shadow: 0 0 10px var(--term-green);
            transform: translateX(-2px);
        }

        .btn:active:not(.disabled) { transform: scale(0.98); }

        .btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .btn-name { font-weight: bold; display: block; }
        .btn-desc { font-size: 10px; color: #aaa; display: block; margin: 2px 0; }
        .btn-cost { float: right; font-weight: bold; }

        /* OVERCLOCK BUTTON SPECIAL STYLING */
        #btn-overclock { border-color: #f00; color: #f00; }
        #btn-overclock:hover:not(.disabled) { box-shadow: 0 0 10px #f00; background: #220000; }

        /* CENTER: Singularity Button */
        #singularity-container {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            display: none; /* Hidden by default */
        }

        #btn-singularity {
            background: black;
            color: white;
            border: 2px solid white;
            padding: 15px 40px;
            font-size: 20px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            letter-spacing: 4px;
            animation: glitch-pulse 0.2s infinite;
            box-shadow: 0 0 20px white;
        }

        @keyframes glitch-pulse {
            0% { transform: translate(0,0); text-shadow: 2px 0 #f0f, -2px 0 #0ff; }
            25% { transform: translate(-2px, 2px); }
            50% { transform: translate(2px, -2px); text-shadow: -2px 0 #f0f, 2px 0 #0ff; }
            75% { transform: translate(-2px, -2px); }
            100% { transform: translate(0,0); }
        }

        /* --- DEV MENU --- */
        #dev-menu {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            background: #111;
            border: 2px solid var(--term-red);
            padding: 20px;
            pointer-events: auto;
            z-index: 9999;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.2);
        }

        #dev-menu h2 {
            margin: 0 0 20px 0;
            color: var(--term-red);
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .dev-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .dev-btn {
            background: #200;
            color: #f88;
            border: 1px solid #500;
            padding: 10px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
        }
        
        .dev-btn:hover { background: #400; }
        .dev-btn:active { background: #f00; color: black; }

        /* OVERLAYS */
        #intro-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
            animation: slow-blink 2s infinite;
            z-index: 100;
            pointer-events: none;
        }

        #flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 1s ease-out;
        }

        @keyframes slow-blink { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div id="flash-overlay"></div>

    <div id="ui-layer">
        <div id="intro-overlay">CLICK TO INITIALIZE SIMULATION<br><span style="font-size:12px; color:#666">(Press ~ for Dev Tools)</span></div>

        <div id="stats-panel" class="hud-panel">
            <div class="stat-row"><span class="label">CACHE:</span> <span class="val-money" id="disp-cash">$0</span></div>
            <div class="stat-row"><span class="label">DARK MATTER:</span> <span class="val-dm" id="disp-dm">0</span></div>
            <div class="stat-row"><span class="label">HITS/SEC:</span> <span class="val-hps" id="disp-hps">0</span></div>
            <div class="stat-row"><span class="label">BALLS:</span> <span id="disp-balls">1</span>/200</div>
        </div>

        <div id="shop-panel" class="hud-panel">
            <div class="shop-header">PHYSICS MODIFIERS</div>
            </div>

        <div id="singularity-container">
            <button id="btn-singularity" onclick="triggerSingularity()">⚠ INITIATE SINGULARITY ⚠</button>
        </div>
    </div>

    <div id="dev-menu">
        <h2>DEV CONSOLE <span>[~] to Close</span></h2>
        <div class="dev-grid">
            <button class="dev-btn" onclick="devAddMoney(1000000)">+ $1 MILLION</button>
            <button class="dev-btn" onclick="devAddMoney(1000000000)">+ $1 BILLION</button>
            <button class="dev-btn" onclick="devAddMoney(1000000000000)">+ $1 TRILLION</button>
            
            <button class="dev-btn" onclick="devAddBalls(1)">+ 1 BALL</button>
            <button class="dev-btn" onclick="devAddBalls(10)">+ 10 BALLS</button>
            <button class="dev-btn" onclick="devAddBalls(50)">+ 50 BALLS</button>

            <button class="dev-btn" onclick="devAddDM(100)">+ 100 DARK MATTER</button>
            <button class="dev-btn" onclick="devAddDM(10000)">+ 10k DARK MATTER</button>
            <button class="dev-btn" onclick="devForceSingularity()">FORCE SINGULARITY</button>

            <button class="dev-btn" onclick="devMaxCrunch()">MAX WALL CRUNCH</button>
            <button class="dev-btn" onclick="devHyperSpeed()">HYPER VELOCITY</button>
            <button class="dev-btn" onclick="devReset()">HARD RESET</button>
        </div>
    </div>

<script>
/**
 * ENGINE: SINGULARITY CHAMBER v2.5
 * FEATURES: Physics Expansion, Particle Engine, Dev Tools
 */

// --- CONFIGURATION ---
const MAX_BALLS = 200;
const MAX_CRUNCH_RATIO = 0.45; // Max 45% of screen width/height per side
const OVERCLOCK_DURATION = 10000;
const OVERCLOCK_COOLDOWN = 60000;

// --- STATE ---
let state = {
    // Economy
    cash: 0,
    darkMatter: 0,
    totalCashPrestige: 0,
    
    // Physics Globals
    padding: 0,
    timeScale: 1.0,
    bounceGain: 0.0,
    gravityStr: 0,
    quantumChance: 0,
    
    // Objects
    balls: [],
    particles: [],
    
    // Meta
    hps: 0,
    hitsThisSecond: 0,
    lastSecTime: 0,
    
    // Flags
    overclockActive: false,
    overclockReadyTime: 0,
    audioReady: false,
    isResetting: false,
    devMenuOpen: false
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height;

// --- AUDIO ENGINE ---
let audioCtx, masterGain;

function initAudio() {
    if(state.audioReady) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.15;
    masterGain.connect(audioCtx.destination);
    state.audioReady = true;
    document.getElementById('intro-overlay').style.display = 'none';
}

function playHitSound(x, velocity) {
    if(!state.audioReady || state.isResetting) return;
    if(velocity < 0.5) return; 

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    const pan = x / width;
    const freq = 100 + (pan * 900);
    
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    const vol = Math.min(velocity / 40, 1.0);
    const dur = 0.05 + (vol * 0.1);

    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

    osc.connect(gain);
    gain.connect(masterGain);
    
    osc.start();
    osc.stop(audioCtx.currentTime + dur + 0.05);
}

// --- PARTICLE SYSTEM ---
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 0.03 + 0.02;
        this.color = color;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.92; // Friction
        this.vy *= 0.92;
        this.life -= this.decay;
    }

    draw() {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

function spawnExplosion(x, y, count = 5) {
    // Simple logic to keep performance high
    if (state.particles.length > 300) return; 
    for(let i=0; i<count; i++) {
        state.particles.push(new Particle(x, y, '#fff'));
    }
}

// --- VISUALS ---
function getVelocityColor(v) {
    if (v < 20) {
        const t = v / 20;
        return `rgb(${255 * (1-t)}, 255, 255)`;
    } else if (v < 50) {
        const t = (v - 20) / 30;
        return `rgb(${255 * t}, ${255 * (1-t)}, 255)`; 
    } else if (v < 100) {
        const t = (v - 50) / 50;
        return `rgb(255, ${255*t*0.84}, 0)`; 
    } else if (v < 200) {
        return `rgb(255, ${215 * (1-((v-100)/100))}, 0)`;
    } else {
        return '#000000'; 
    }
}

// --- PHYSICS ENTITY ---
class Ball {
    constructor(x, y) {
        this.reset(x, y);
    }

    reset(x, y) {
        this.x = x || width/2;
        this.y = y || height/2;
        this.mass = 1;
        
        const speedMult = 1 + (state.darkMatter * 0.01);
        const baseV = 6 * speedMult;
        const angle = Math.random() * Math.PI * 2;
        
        this.vx = Math.cos(angle) * baseV;
        this.vy = Math.sin(angle) * baseV;
        this.radius = 5;
    }

    update() {
        const dt = state.timeScale;
        
        // Gravity
        if (state.gravityStr > 0) {
            const dx = (width/2) - this.x;
            const dy = (height/2) - this.y;
            const distSq = dx*dx + dy*dy;
            const dist = Math.sqrt(distSq);
            
            if (dist > 10) {
                const force = state.gravityStr / dist; 
                this.vx += (dx / dist) * force * dt;
                this.vy += (dy / dist) * force * dt;
            }
        }

        // Velocity Gain
        if (state.bounceGain > 0) {
            this.vx *= (1 + state.bounceGain);
            this.vy *= (1 + state.bounceGain);
        }

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // Bounds
        const p = state.padding;
        const rw = width - p;
        const rh = height - p;
        let hit = false;

        // X Collision
        if (this.x - this.radius < p) {
            if(this.tryQuantumTunnel('x')) return;
            this.x = p + this.radius;
            this.vx *= -1;
            hit = true;
        } else if (this.x + this.radius > rw) {
            if(this.tryQuantumTunnel('x')) return;
            this.x = rw - this.radius;
            this.vx *= -1;
            hit = true;
        }

        // Y Collision
        if (this.y - this.radius < p) {
            if(this.tryQuantumTunnel('y')) return;
            this.y = p + this.radius;
            this.vy *= -1;
            hit = true;
        } else if (this.y + this.radius > rh) {
            if(this.tryQuantumTunnel('y')) return;
            this.y = rh - this.radius;
            this.vy *= -1;
            hit = true;
        }

        if (hit) {
            this.onHit();
        }
    }

    tryQuantumTunnel(axis) {
        if (Math.random() < state.quantumChance) {
            const p = state.padding;
            if (axis === 'x') {
                if (this.vx < 0) this.x = (width - p) - this.radius - 2;
                else this.x = p + this.radius + 2;
            } else {
                if (this.vy < 0) this.y = (height - p) - this.radius - 2;
                else this.y = p + this.radius + 2;
            }
            // FX
            spawnExplosion(this.x, this.y, 10);
            this.onHit();
            return true;
        }
        return false;
    }

    onHit() {
        state.hitsThisSecond++;
        const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
        const dmMult = 1 + (state.darkMatter * 0.1);
        const amount = Math.floor((1 + (speed/5)) * dmMult);
        state.cash += amount;
        state.totalCashPrestige += amount;
        playHitSound(this.x, speed);
    }
    
    draw() {
        const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
        const color = getVelocityColor(speed);
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
        
        if (speed > 200) {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.fillStyle = '#000';
            ctx.stroke();
            ctx.fill();
        } else {
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 10 + (speed/5);
            ctx.fill();
            ctx.shadowBlur = 0; 
        }
    }
}

// --- PHYSICS: BALL COLLISIONS ---
function handleCollisions() {
    const balls = state.balls;
    const len = balls.length;
    
    // O(N^2) checks - Optimized by simple AABB check first usually, but pure loop is fine for 200 items
    for (let i = 0; i < len; i++) {
        for (let j = i + 1; j < len; j++) {
            const b1 = balls[i];
            const b2 = balls[j];
            
            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const distSq = dx*dx + dy*dy;
            const radSum = b1.radius + b2.radius;
            
            if (distSq < radSum * radSum) {
                // COLLISION DETECTED
                const dist = Math.sqrt(distSq);
                
                // 1. Resolve Overlap (prevent sticking)
                const overlap = radSum - dist;
                const nx = dx / dist; // Normal X
                const ny = dy / dist; // Normal Y
                
                // Move apart
                b1.x -= nx * overlap * 0.5;
                b1.y -= ny * overlap * 0.5;
                b2.x += nx * overlap * 0.5;
                b2.y += ny * overlap * 0.5;
                
                // 2. Resolve Velocity (Elastic)
                // Normal velocity
                const v1n = b1.vx * nx + b1.vy * ny;
                const v2n = b2.vx * nx + b2.vy * ny;

                // Swap normal velocities (since mass is equal)
                const v1nAfter = v2n;
                const v2nAfter = v1n;
                
                // Apply change
                const dp1 = v1nAfter - v1n;
                const dp2 = v2nAfter - v2n;
                
                b1.vx += dp1 * nx;
                b1.vy += dp1 * ny;
                b2.vx += dp2 * nx;
                b2.vy += dp2 * ny;

                // 3. FX
                spawnExplosion(b1.x + (dx/2), b1.y + (dy/2), 3);
            }
        }
    }
}

// --- UPGRADES ---
const upgrades = [
    {
        id: 'splitter',
        name: 'SPLITTER',
        desc: 'Add a new ball to the chamber.',
        base: 25, mult: 1.5,
        trigger: () => {
            if(state.balls.length < MAX_BALLS) state.balls.push(new Ball());
        },
        max: MAX_BALLS
    },
    {
        id: 'elasticity',
        name: 'ELASTICITY',
        desc: '+15% Velocity per ball instantly.',
        base: 100, mult: 2.0,
        trigger: () => {
            state.balls.forEach(b => { b.vx*=1.15; b.vy*=1.15; });
        }
    },
    {
        id: 'wall_crunch',
        name: 'WALL CRUNCH',
        desc: 'Contract chamber dimensions.',
        base: 500, mult: 2.5,
        trigger: () => {
            const maxP = Math.min(width, height) * MAX_CRUNCH_RATIO;
            if(state.padding < maxP) state.padding += 25;
            if(state.padding > maxP) state.padding = maxP;
            
            const p = state.padding;
            state.balls.forEach(b => {
                b.x = Math.max(p+10, Math.min(width-p-10, b.x));
                b.y = Math.max(p+10, Math.min(height-p-10, b.y));
            });
            checkSingularityReady();
        }
    },
    {
        id: 'gravity',
        name: 'GRAVITY WELL',
        desc: 'Central Black Hole curves trajectories.',
        base: 2000, mult: 3.0,
        trigger: () => { state.gravityStr += 0.5; }
    },
    {
        id: 'friction',
        name: 'NO FRICTION',
        desc: 'Balls gain 1% speed on every bounce.',
        base: 5000, mult: 4.0,
        trigger: () => { state.bounceGain += 0.005; }
    },
    {
        id: 'quantum',
        name: 'QUANTUM TUNNEL',
        desc: 'Chance to teleport through walls.',
        base: 10000, mult: 5.0,
        trigger: () => { state.quantumChance += 0.05; }
    },
    {
        id: 'overclock',
        name: 'OVERCLOCK',
        desc: '2x Speed for 10s. (Cooldown: 60s)',
        base: 0, mult: 1, 
        trigger: () => activateOverclock()
    }
];

let upgradeLevels = new Array(upgrades.length).fill(0);

function initShop() {
    const p = document.getElementById('shop-panel');
    p.innerHTML = '<div class="shop-header">PHYSICS MODIFIERS</div>';
    
    upgrades.forEach((u, i) => {
        const btn = document.createElement('div');
        btn.className = 'btn';
        if(u.id === 'overclock') btn.id = 'btn-overclock';
        btn.onclick = () => buyUpgrade(i);
        
        btn.innerHTML = `
            <span class="btn-name">${u.name} <span class="btn-cost" id="cost-${i}">$0</span></span>
            <span class="btn-desc">${u.desc}</span>
            <div style="font-size:10px; color:#666">Lvl: <span id="lvl-${i}">0</span></div>
        `;
        p.appendChild(btn);
    });
}

function updateShop() {
    upgrades.forEach((u, i) => {
        let cost = Math.floor(u.base * Math.pow(u.mult, upgradeLevels[i]));
        
        if(u.id === 'overclock') {
            const now = Date.now();
            const cooldownRem = Math.max(0, state.overclockReadyTime - now);
            const btn = document.getElementById('btn-overclock');
            
            if (state.overclockActive) {
                 document.getElementById(`cost-${i}`).innerText = "ACTIVE";
                 btn.classList.add('disabled');
            } else if (cooldownRem > 0) {
                 document.getElementById(`cost-${i}`).innerText = (cooldownRem/1000).toFixed(1) + "s";
                 btn.classList.add('disabled');
            } else {
                 document.getElementById(`cost-${i}`).innerText = "READY";
                 btn.classList.remove('disabled');
            }
            return;
        }

        if (u.id === 'splitter' && state.balls.length >= MAX_BALLS) {
            document.getElementById(`cost-${i}`).innerText = "MAXED";
        } else {
            document.getElementById(`cost-${i}`).innerText = "$" + cost.toLocaleString();
        }
        
        document.getElementById(`lvl-${i}`).innerText = upgradeLevels[i];

        const btn = document.getElementById(`cost-${i}`).parentNode.parentNode;
        if (state.cash < cost || (u.id==='splitter' && state.balls.length >= MAX_BALLS)) {
            btn.classList.add('disabled');
        } else {
            btn.classList.remove('disabled');
        }
    });
}

function buyUpgrade(idx) {
    const u = upgrades[idx];
    if(u.id === 'overclock') {
        if(!state.overclockActive && Date.now() > state.overclockReadyTime) u.trigger();
        return;
    }

    const cost = Math.floor(u.base * Math.pow(u.mult, upgradeLevels[idx]));
    if (state.cash >= cost) {
        if(u.id === 'splitter' && state.balls.length >= MAX_BALLS) return;
        state.cash -= cost;
        upgradeLevels[idx]++;
        u.trigger();
        updateShop();
    }
}

function activateOverclock() {
    state.overclockActive = true;
    state.timeScale = 2.0; 
    setTimeout(() => {
        state.overclockActive = false;
        state.timeScale = 1.0;
        state.overclockReadyTime = Date.now() + OVERCLOCK_COOLDOWN;
    }, OVERCLOCK_DURATION);
}

// --- GAMEPLAY LOOPS ---

function checkSingularityReady() {
    const maxP = Math.min(width, height) * MAX_CRUNCH_RATIO;
    if (state.padding >= maxP - 5) {
        document.getElementById('singularity-container').style.display = 'block';
    }
}

function triggerSingularity() {
    if(state.isResetting) return;
    state.isResetting = true;
    
    const gainedDM = Math.floor(state.totalCashPrestige / 1000000);
    state.darkMatter += gainedDM;
    
    let frame = 0;
    const anim = setInterval(() => {
        frame++;
        state.balls.forEach(b => {
            b.x += (width/2 - b.x) * 0.1;
            b.y += (height/2 - b.y) * 0.1;
        });
        state.padding *= 0.95; 
        
        if(frame > 60) {
            clearInterval(anim);
            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = 1;
            setTimeout(() => {
                resetGameWorld();
                flash.style.opacity = 0;
                state.isResetting = false;
            }, 1000);
        }
    }, 16);
}

function resetGameWorld() {
    state.cash = 0;
    state.totalCashPrestige = 0;
    state.padding = 0;
    state.bounceGain = 0;
    state.gravityStr = 0;
    state.quantumChance = 0;
    state.balls = [new Ball()]; 
    state.particles = [];
    upgradeLevels.fill(0);
    document.getElementById('singularity-container').style.display = 'none';
    updateShop();
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}

function draw() {
    // 1. CLEAR & TRAIL
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
    ctx.fillRect(0, 0, width, height);

    // 2. WALLS
    if(state.padding > 0) {
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        ctx.strokeRect(state.padding, state.padding, width - state.padding*2, height - state.padding*2);
    }
    
    // 3. COLLISION PHYSICS
    handleCollisions();

    // 4. ENTITIES (Additive)
    ctx.globalCompositeOperation = 'lighter';
    
    // Draw Particles
    for(let i=state.particles.length-1; i>=0; i--) {
        let p = state.particles[i];
        p.update();
        p.draw();
        if(p.life <= 0) state.particles.splice(i, 1);
    }

    // Draw Balls
    state.balls.forEach(b => {
        b.update();
        b.draw();
    });

    // Singularity Effect
    if(state.isResetting) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(width/2, height/2, Math.random()*50, 0, Math.PI*2);
        ctx.fill();
    }

    // 5. UPDATE UI
    const now = Date.now();
    if (now - state.lastSecTime >= 1000) {
        state.hps = state.hitsThisSecond;
        state.hitsThisSecond = 0;
        state.lastSecTime = now;
        document.getElementById('disp-hps').innerText = state.hps;
    }
    
    document.getElementById('disp-cash').innerText = "$" + state.cash.toLocaleString();
    document.getElementById('disp-dm').innerText = state.darkMatter.toLocaleString();
    document.getElementById('disp-balls').innerText = state.balls.length;

    updateShop();
    requestAnimationFrame(draw);
}

// --- DEV TOOLS ---
function toggleDevMenu() {
    const menu = document.getElementById('dev-menu');
    state.devMenuOpen = !state.devMenuOpen;
    menu.style.display = state.devMenuOpen ? 'block' : 'none';
}

function devAddMoney(amt) { state.cash += amt; state.totalCashPrestige += amt; }
function devAddBalls(amt) { 
    for(let i=0; i<amt; i++) {
        if(state.balls.length < MAX_BALLS) state.balls.push(new Ball());
    }
}
function devAddDM(amt) { state.darkMatter += amt; }
function devForceSingularity() { 
    state.padding = Math.min(width, height) * MAX_CRUNCH_RATIO;
    document.getElementById('singularity-container').style.display = 'block';
}
function devMaxCrunch() {
    state.padding = Math.min(width, height) * MAX_CRUNCH_RATIO;
    const p = state.padding;
    state.balls.forEach(b => {
        b.x = Math.max(p+10, Math.min(width-p-10, b.x));
        b.y = Math.max(p+10, Math.min(height-p-10, b.y));
    });
    checkSingularityReady();
}
function devHyperSpeed() {
    state.balls.forEach(b => {
        b.vx *= 5; b.vy *= 5;
    });
}
function devReset() {
    if(confirm("FULL RESET?")) {
        state.darkMatter = 0;
        resetGameWorld();
    }
}

// --- BOOT ---
window.addEventListener('resize', resize);
window.addEventListener('mousedown', initAudio);
window.addEventListener('keydown', (e) => {
    if(e.key === '`' || e.key === '~') toggleDevMenu();
});

resize();
initShop();
state.balls.push(new Ball()); 
draw();

</script>
