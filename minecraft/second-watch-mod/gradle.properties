org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Loom is not configuration-cache compatible yet.
org.gradle.configuration-cache=false

# --- Toolchain (verified against Fabric meta + Mojang manifest, 2026-08-17) ---
# There is NO mappings line in build.gradle and that is correct, not an omission.
# Minecraft 26.x ships DEOBFUSCATED - the shipped client jar contains real names
# (net/minecraft/client/Camera.class). Consequently Mojang stopped publishing
# client_mappings at 26.1, yarn stopped at 1.21.11, and intermediary for 26.2 is
# a 0.0.0 stub. Do not add officialMojangMappings() back; it fails to resolve.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.157.0+26.2

# Minecraft 26.x requires Java 25 (manifest javaVersion.majorVersion = 25).
java_version=25

# Simple Voice Chat addon API - the phantom voice system needs it.
# compileOnly: players install the mod themselves, we never bundle it.
voicechat_api_version=2.6.20

# The name the dev client logs in as. Change this to your Minecraft username.
# NOTE: a dev client is always offline-mode, so this gets you the right NAME but
# never the right SKIN - see PLAYING.md for why that matters for this mod.
dev_username=Tutut

version=0.1.0
group=com.secondwatch
