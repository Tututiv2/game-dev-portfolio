org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Loom is not configuration-cache compatible yet.
org.gradle.configuration-cache=false

# --- Toolchain: identical to MinecraftHorrorMod, which boots ---
# There is NO mappings line in build.gradle and that is correct, not an omission.
# Minecraft 26.x ships DEOBFUSCATED, so Mojang stopped publishing client_mappings
# at 26.1 and intermediary for 26.2 is a 0.0.0 stub. Do not add
# officialMojangMappings(); it fails to resolve.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.157.0+26.2

# Minecraft 26.x requires Java 25 (manifest javaVersion.majorVersion = 25).
java_version=25

# The name the dev client logs in as.
dev_username=Tutut

version=1.0.0
group=com.auracapes
