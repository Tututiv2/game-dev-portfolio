org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom is not configuration-cache compatible yet.
org.gradle.configuration-cache=false

# --- Toolchain: identical to SkyblockClone/tools/testpilot, which boots in the same instance ---
# There is NO mappings line in build.gradle and that is correct, not an omission:
# Minecraft 26.x ships DEOBFUSCATED. Do not add officialMojangMappings(); it fails to resolve.
#
# Versions match MinecraftLauncher/data/instances/Fabric-26.1.2 exactly:
#   instance.json  loader_version 0.19.5, mc_version 26.1.2
#   mods/          fabric-api-0.155.3+26.1.2.jar
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT
fabric_api_version=0.155.3+26.1.2

# Minecraft 26.x requires Java 25.
java_version=25

version=1.0.0
group=com.aisky
